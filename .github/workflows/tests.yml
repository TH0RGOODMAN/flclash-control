name: Client and integration checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  client:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install client and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run client and MCP contract tests
        run: python -m pytest -q
      - name: Build sdist and wheel and verify clean package contents
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          python -m build
          python -c "import zipfile, glob; z = zipfile.ZipFile(glob.glob('dist/*.whl')[0]); names = z.namelist(); assert any(n.endswith('flclash_control/py.typed') for n in names); assert not any(n.startswith(('.local', 'experiments', 'integration')) for n in names); print('Verified wheel entries:', len(names))"
          python -m venv .isolated-wheel-test
          .\.isolated-wheel-test\Scripts\python.exe -m pip install (Get-Item dist\*.whl).FullName
          .\.isolated-wheel-test\Scripts\flclash-control.exe --version

  patch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify integration.patch applies cleanly to FlClash v0.8.93
        run: |
          git clone --branch v0.8.93 --depth 1 https://github.com/chen08209/FlClash.git upstream-flclash
          git -C upstream-flclash rev-parse HEAD
          git -C upstream-flclash apply --check "$GITHUB_WORKSPACE/integration/flclash/integration.patch"
