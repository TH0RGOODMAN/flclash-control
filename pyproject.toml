[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flclash-control"
version = "0.2.0"
description = "Authenticated CLI and MCP control bridge for a running FlClash Windows GUI"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
readme = "README.md"
authors = [{ name = "hea1" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "flclash",
  "mihomo",
  "clash",
  "proxy",
  "windows",
  "cli",
]
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2.0,<3",
  "pywin32>=311; sys_platform == 'win32'",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://hea1.org/"
Repository = "https://github.com/TH0RGOODMAN/flclash-control"
Issues = "https://github.com/TH0RGOODMAN/flclash-control/issues"
Changelog = "https://github.com/TH0RGOODMAN/flclash-control/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
flclash-control = "flclash_control.cli:main"
flclash-control-mcp = "flclash_control.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flclash_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
